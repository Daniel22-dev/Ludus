name: LUDUS preload diagnostic
on:
  push:
    branches:
      - diag/preload-404
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.8.0
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Add network diagnostics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("scripts/qa-critical.mjs")
          s=p.read_text()
          needle='        page.on("pageerror", (e) => errors.push(String(e)));\n'
          repl=needle+'        page.on("response", (r) => { if (r.status() >= 400) errors.push(\`HTTP \${r.status()} \${r.url()}\`); });\n'
          if needle not in s:
              raise SystemExit("diagnostic anchor missing")
          p.write_text(s.replace(needle,repl,1))
          PY
      - run: npm run build
      - name: Run critical flow with URLs
        run: npm run qa:critical
