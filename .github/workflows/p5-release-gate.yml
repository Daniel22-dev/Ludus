name: P5 R2 pre-production release gate

on:
  workflow_dispatch:
  push:
    branches: [candidate, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  p5-release-gate:
    runs-on: ubuntu-24.04
    # Immutable image includes audited Chromium and all OS dependencies.
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
    timeout-minutes: 45
    steps:
      - name: Enforce canonical PR source
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          PR_HEAD: ${{ github.head_ref }}
          PR_BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "$PR_BASE" != "main" ] || [ "$PR_HEAD" != "candidate" ]; then
            echo "::error::Safe Promotion requires candidate -> main; got ${PR_HEAD:-<empty>} -> ${PR_BASE:-<empty>}."
            exit 1
          fi
          echo "Safe Promotion topology verified: candidate -> main."
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.8.0
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
      - name: Verify pinned audit tools
        run: |
          node -e "const p=require('./node_modules/axe-core/package.json'); if(p.version!=='4.12.1') process.exit(1)"
          node -e "const p=require('./node_modules/playwright/package.json'); if(p.version!=='1.61.1') process.exit(1)"
      - name: Verify image-baked Playwright Chromium and launch smoke
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, accessSync, appendFileSync, constants } from 'node:fs';
          import { chromium } from 'playwright';
          const installed = JSON.parse(readFileSync('./node_modules/playwright/package.json', 'utf8')).version;
          if (installed !== '1.61.1') throw new Error('Playwright version mismatch: ' + installed);
          if (process.env.PLAYWRIGHT_BROWSERS_PATH !== '/ms-playwright') {
            throw new Error('Unexpected browser source: ' + process.env.PLAYWRIGHT_BROWSERS_PATH);
          }
          const executable = chromium.executablePath();
          accessSync(executable, constants.X_OK);
          const browser = await chromium.launch({ headless: true });
          try {
            const page = await browser.newPage();
            await page.goto('data:text/html,%3Ctitle%3ELUDUS%20P2.2%20smoke%3C%2Ftitle%3E');
            if ((await page.title()) !== 'LUDUS P2.2 smoke') throw new Error('Chromium smoke test failed');
            console.log('Verified preinstalled Chromium: ' + executable + ' (' + browser.version() + ')');
          } finally {
            await browser.close();
          }
          appendFileSync(process.env.GITHUB_ENV, 'CHROMIUM_PATH=' + executable + '\n');
          NODE
      - name: Run P5 R2 release gate
        run: npm run qa:p5:ci
        env:
          GARP27_TRUSTED_POLICY_SHA256: ${{ vars.GARP27_TRUSTED_POLICY_SHA256 }}
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p5-r2-${{ github.sha }}
          path: |
            dist/qa-p5-*.json
            dist/qa-p3-browser-report.json
            dist/quality-report.json
