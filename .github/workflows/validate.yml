name: Validate and certify LUDUS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.8.0
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org --no-audit --no-fund
      - name: Verify image-baked Playwright Chromium and launch smoke
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, accessSync, appendFileSync, constants } from 'node:fs';
          import { chromium } from 'playwright';
          const installed = JSON.parse(readFileSync('./node_modules/playwright/package.json', 'utf8')).version;
          if (installed !== '1.61.1') throw new Error('Playwright version mismatch: ' + installed);
          if (process.env.PLAYWRIGHT_BROWSERS_PATH !== '/ms-playwright') {
            throw new Error('Unexpected browser source: ' + process.env.PLAYWRIGHT_BROWSERS_PATH);
          }
          const executable = chromium.executablePath();
          accessSync(executable, constants.X_OK);
          const browser = await chromium.launch({ headless: true });
          try {
            const page = await browser.newPage();
            await page.goto('data:text/html,%3Ctitle%3ELUDUS%20P2.2%20smoke%3C%2Ftitle%3E');
            if ((await page.title()) !== 'LUDUS P2.2 smoke') throw new Error('Chromium smoke test failed');
            console.log('Verified preinstalled Chromium: ' + executable + ' (' + browser.version() + ')');
          } finally {
            await browser.close();
          }
          appendFileSync(process.env.GITHUB_ENV, 'CHROMIUM_PATH=' + executable + '\n');
          NODE
      - name: Test application
        run: npm test
      - name: Run GHRAB QA release gate
        run: npm run qa:release
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ghrab-validate-${{ github.sha }}
          path: qa-results
      - name: Verify GHRAB Platform P3 conformance
        run: npm run qa:platform
      # The required, independent P5 job covers canonical same-repository
      # candidate -> main PRs. All other events still execute full P5 here.
      # The active protected-main ruleset requires test + p5-release-gate + axe.
      - name: Enforce P5 R2 release gate
        if: >-
          github.event_name != 'pull_request' ||
          github.base_ref != 'main' ||
          github.head_ref != 'candidate' ||
          github.event.pull_request.head.repo.full_name != github.repository
        run: npm run qa:p5:ci
        env:
          GARP27_TRUSTED_POLICY_SHA256: ${{ vars.GARP27_TRUSTED_POLICY_SHA256 }}
