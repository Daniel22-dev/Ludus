name: GHRAB QA and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  qa-build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release-meta.outputs.version }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Read release metadata
        id: release-meta
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.16.0
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
      - name: Install pinned Playwright Chromium
        shell: bash
        run: |
          npx playwright install --with-deps chromium
          node -e "console.log('CHROMIUM_PATH=' + require('playwright').chromium.executablePath())" >> "$GITHUB_ENV"
      - name: Test application
        run: npm test
      - name: Run unified error reporter regression
        run: npm run test:reporter
      - name: Run GHRAB QA release gate
        run: npm run qa:release
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ghrab-qa-${{ github.sha }}
          path: qa-results
      - name: Verify GHRAB Platform P3 conformance
        run: npm run qa:platform
      - name: Enforce P5 R2 release gate
        run: npm run qa:p5:ci
      - name: Verify AI Studio dispatch credential
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          AI_STUDIO_DISPATCH_TOKEN: ${{ secrets.AI_STUDIO_DISPATCH_TOKEN }}
        run: |
          if [ -z "$AI_STUDIO_DISPATCH_TOKEN" ]; then
            echo "::error::Missing AI_STUDIO_DISPATCH_TOKEN. Deployment is blocked because AI Studio could not be notified safely."
            exit 1
          fi
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: qa-build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  notify-ai-studio:
    if: github.event_name != 'pull_request'
    needs: [qa-build, deploy]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Wait for the deployed Studio manifest
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.qa-build.outputs.version }}
        run: |
          manifest_url="https://daniel22-dev.github.io/Ludus/studio-manifest.json"
          for attempt in $(seq 1 18); do
            live_version=$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --max-time 15 "$manifest_url?run=${GITHUB_RUN_ID}-${attempt}" 2>/dev/null | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{process.stdout.write(String(JSON.parse(s).version||''))}catch{}})")
            if [ "$live_version" = "$EXPECTED_VERSION" ]; then
              echo "Live manifest confirmed at version $live_version."
              exit 0
            fi
            sleep 5
          done
          echo "::error::The deployed studio-manifest.json did not reach expected version $EXPECTED_VERSION."
          exit 1

      - name: Dispatch app-updated event to AI Studio
        shell: bash
        env:
          AI_STUDIO_DISPATCH_TOKEN: ${{ secrets.AI_STUDIO_DISPATCH_TOKEN }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          DEPLOYED_URL: ${{ needs.deploy.outputs.page_url }}
          APP_VERSION: ${{ needs.qa-build.outputs.version }}
        run: |
          node <<'NODE' > "$RUNNER_TEMP/ai-studio-dispatch.json"
          const payload = {
            event_type: 'app-updated',
            client_payload: {
              app_id: 'ludus',
              app_version: process.env.APP_VERSION,
              source_repository: process.env.SOURCE_REPOSITORY,
              source_sha: process.env.SOURCE_SHA,
              deployed_url: process.env.DEPLOYED_URL,
            },
          };
          process.stdout.write(JSON.stringify(payload));
          NODE

          curl --proto '=https' --tlsv1.2 --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $AI_STUDIO_DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Daniel22-dev/AI-Studio-GHRAB/dispatches \
            --data-binary "@$RUNNER_TEMP/ai-studio-dispatch.json"

          echo "AI Studio dispatch accepted for $SOURCE_REPOSITORY@$SOURCE_SHA version $APP_VERSION"
