name: GHRAB QA and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Keep PR runs independent from published main releases. Never cancel a
# running production deploy, including one started by workflow_dispatch.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  qa-build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.release-meta.outputs.version }}
      patch_assurance_sha256: ${{ steps.release-evidence.outputs.patch_assurance_sha256 }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Read release metadata
        id: release-meta
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.8.0
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
      - name: Test release identity verifier (positive and negative cases)
        run: node --test scripts/verify-live-release.test.mjs
      - name: Install pinned Playwright Chromium
        shell: bash
        run: |
          npx playwright install --with-deps chromium
          node -e "console.log('CHROMIUM_PATH=' + require('playwright').chromium.executablePath())" >> "$GITHUB_ENV"
      - name: Test application
        run: npm test
      - name: Run unified error reporter regression
        run: npm run test:reporter
      - name: Run GHRAB QA release gate
        run: npm run qa:release
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ghrab-qa-${{ github.sha }}
          path: qa-results
      - name: Verify GHRAB Platform P3 conformance
        run: npm run qa:platform
      - name: Enforce P5 R2 release gate
        run: npm run qa:p5:ci
        env:
          GARP27_TRUSTED_POLICY_SHA256: ${{ vars.GARP27_TRUSTED_POLICY_SHA256 }}
      # Exercise the exact publish-identity binding on PRs as well as main.
      # This fails before release if P5 stops generating commit-bound evidence.
      - name: Bind publishable assurance manifest to this source commit
        id: release-evidence
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          const patchBytes = fs.readFileSync('dist/patch-assurance.json');
          const patch = JSON.parse(patchBytes.toString('utf8'));
          const studio = JSON.parse(fs.readFileSync('dist/studio-manifest.json', 'utf8'));
          const digest = createHash('sha256').update(patchBytes).digest('hex');
          if (patch.schema !== 'ghrab-patch-assurance-manifest-v1' ||
              patch.appId !== 'ludus' ||
              patch.sourceRevision !== process.env.GITHUB_SHA ||
              studio.id !== 'ludus' || studio.version !== patch.version ||
              studio.assurance?.evidenceManifestSha256 !== digest) {
            throw new Error('Invalid local release assurance binding; publication blocked.');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'patch_assurance_sha256=' + digest + '\n');
          console.log('Source ' + patch.sourceRevision + '; local assurance SHA-256 ' + digest);
          NODE
      - name: Verify AI Studio dispatch credential
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        env:
          AI_STUDIO_DISPATCH_TOKEN: ${{ secrets.AI_STUDIO_DISPATCH_TOKEN }}
        run: |
          if [ -z "$AI_STUDIO_DISPATCH_TOKEN" ]; then
            echo "::error::Missing AI_STUDIO_DISPATCH_TOKEN. Deployment is blocked because AI Studio could not be notified safely."
            exit 1
          fi
      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: qa-build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  notify-ai-studio:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [qa-build, deploy]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Fetch verification script
        uses: actions/checkout$11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Wait for verified live source and assurance digest
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.qa-build.outputs.version }}
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
          EXPECTED_PATCH_ASSURANCE_SHA256: ${{ needs.qa-build.outputs.patch_assurance_sha256 }}
        run: |
          set -euo pipefail
          manifest_url="https://daniel22-dev.github.io/Ludus/studio-manifest.json"
          assurance_url="https://daniel22-dev.github.io/Ludus/patch-assurance.json"
          for attempt in $(seq 1 18); do
            if curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --max-time 15 \
                "${manifest_url}?run=${GITHUB_RUN_ID}-${attempt}" -o "${RUNNER_TEMP}/ludus-live-studio.json" && \
               curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --max-time 15 \
                "${assurance_url}?run=${GITHUB_RUN_ID}-${attempt}" -o "${RUNNER_TEMP}/ludus-live-assurance.json" && \
               node scripts/verify-live-release.mjs \
                "${RUNNER_TEMP}/ludus-live-studio.json" "${RUNNER_TEMP}/ludus-live-assurance.json"; then
              echo "Live release verified for ${EXPECTED_SOURCE_SHA} (version ${EXPECTED_VERSION})."
              exit 0
            fi
            if [ "${attempt}" -lt 18 ]; then sleep 5; fi
          done
          echo "::error::Live release did not match expected source SHA and assurance digest. AI Studio notification blocked."
          exit 1

      - name: Dispatch app-updated event to AI Studio
        shell: bash
        env:
          AI_STUDIO_DISPATCH_TOKEN: ${{ secrets.AI_STUDIO_DISPATCH_TOKEN }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          DEPLOYED_URL: ${{ needs.deploy.outputs.page_url }}
          APP_VERSION: ${{ needs.qa-build.outputs.version }}
        run: |
          node <<'NODE' > "$RUNNER_TEMP/ai-studio-dispatch.json"
          const payload = {
            event_type: 'app-updated',
            client_payload: {
              app_id: 'ludus',
              app_version: process.env.APP_VERSION,
              source_repository: process.env.SOURCE_REPOSITORY,
              source_sha: process.env.SOURCE_SHA,
              deployed_url: process.env.DEPLOYED_URL,
            },
          };
          process.stdout.write(JSON.stringify(payload));
          NODE

          curl --proto '=https' --tlsv1.2 --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $AI_STUDIO_DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Daniel22-dev/AI-Studio-GHRAB/dispatches \
            --data-binary "@$RUNNER_TEMP/ai-studio-dispatch.json"

          echo "AI Studio dispatch accepted for $SOURCE_REPOSITORY@$SOURCE_SHA version $APP_VERSION"
